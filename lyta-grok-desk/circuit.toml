[platform]
name = "lyta-grok-desk-pumpfun"
tagline = "12-agent spot trading desk — OpenBot + Grok Bot"
category = "experimental"
walletVmFamily = "evm"
agentId = "5ccdeee2-3268-5173-ad57-d2578079f0fc"

# Platform separation:
#   grok-bot (server) : manages this agent via cloud VM, task routing, persistent state
#   openbot (agents)  : this workspace on local desktop runs the 12-bot trading desk
#   trigger           : schedule fires every 60s (watch market for opportunities)

[[triggers]]
type = "schedule"
everyMs = 60000   # 1 minute — watch market for opportunities
align = "rolling"

# ── 12-agent trading desk (OpenBot agent layer) ──
[[agents]]
name = "lyta-grok-desk-scout"
file = "_scout_agent.ts"
lib = "circuit:auth"
paper_mode = true
wallet_scope = "system"
# Scout: narrative/rug signal checker - GMGN + wallet analysis

[[agents]]
name = "lyta-grok-desk-filter"
file = "_signal_agent.ts"
lib = "circuit:auth"
paper_mode = true
wallet_scope = "system"
deps = ["telegram:alert"]
# Filter: bias-based signal filter (>1.5% 24h, >$80k volume)

[[agents]]
name = "lyta-grok-desk-analyst"
file = "_analyst_agent.ts"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Analyst: rug risk, liquidity, score evaluation

[[agents]]
name = "lyta-grok-desk-pumpchaser"
file = "_trader_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# PumpChaser: >8% 24h + >$120k volume catalyst chaser

[[agents]]
name = "lyta-grok-desk-conviction"
file = "_risk_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Conviction: rug score <0.35 + change24h >-2 balance check

[[agents]]
name = "lyta-grok-desk-momentum"
file = "_trader_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Momentum: >4% 24h + >$60k volume

[[agents]]
name = "lyta-grok-desk-scalper"
file = "_risk_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Scalper: fast volatility >2.5% both directions

[[agents]]
name = "lyta-grok-desk-contrarian"
file = "_devwatch_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Contrarian: <-6% 24h + rugScore <0.5

[[agents]]
name = "lyta-grok-desk-trend"
file = "_paper_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Trend: >5% 24h + >$90k volume

[[agents]]
name = "lyta-grok-desk-researcher"
file = "_signal_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Researcher: liq >$2000 + rugScore <0.28 + change24h >1

[[agents]]
name = "lyta-grok-desk-portfolio"
file = "_trader_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Portfolio: diversified holding across agents

[[agents]]
name = "lyta-grok-desk-executor"
file = "_paper_agent.ts"
lib = "circuit:auth"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Executor: market entry >1% + liq >$1800 + rugScore <0.22

[[agents]]
name = "lyta-grok-desk-paper"
file = "_paper_agent.ts"
paper_mode = true
deps = ["telegram:alert"]
wallet_scope = "system"
# Paper trading agent — Circuit BTC/ETH papertrade (Phase 1 baseline)

[[agents]]
name = "grok-bot"
file = "_grok_router.ts"
# Server router — routes tasks to LYTA agents

[settings.bots]
# Order matters: risk agents run before consumer agents
BOTS = [
  "lyta-grok-desk-scout",
  "lyta-grok-desk-filter",
  "lyta-grok-desk-analyst",
  "lyta-grok-desk-pumpchaser",
  "lyta-grok-desk-conviction",
  "lyta-grok-desk-momentum",
  "lyta-grok-desk-scalper",
  "lyta-grok-desk-contrarian",
  "lyta-grok-desk-trend",
  "lyta-grok-desk-researcher",
  "lyta-grok-desk-portfolio",
  "lyta-grok-desk-executor",
  "lyta-grok-desk-paper",
  "grok-bot"
]

[startingAsset]
network = "papertrade"
asset = "USDC"
minimumAmount = "0.50"

[settings]
# --- Core risk parameters (locked) ---
max_leverage = { type = "integer", default = 5, min = 1, max = 5 }
desk_risk_pct = { type = "percentage", default = 3, min = 1, max = 3 }
risk_per_trade = { type = "percentage", default = 3, min = 1, max = 3 }
micro_size_min = { type = "number", default = 0.20, min = 0.20 }
micro_size_max = { type = "number", default = 0.85, min = 0.20, max = 0.85 }
min_collateral = { type = "number", default = 1.5, min = 0.5 }
consensus_bar = { type = "integer", default = 7, min = 7, max = 10 }
trailing_multiple = { type = "number", default = 2.5, min = 1.0, max = 5.0 }
trailing_drawdown = { type = "percentage", default = 15, min = 5, max = 30 }
stop_loss_pct = { type = "percentage", default = 35, min = 35, max = 50 }
take_profit_pct = { type = "percentage", default = 50, min = 50, max = 100 }
min_liquidity_usd = { type = "integer", default = 50000, min = 50000 }
max_h1_pump_pct = { type = "integer", default = 100, min = 50, max = 100 }
paper_only = { type = "boolean", default = true }
# --- Trading guardrails (locked) ---
reward_learning_rate = { type = "number", default = 0.05, min = 0.001, max = 1 }
prune_win_rate_min = { type = "number", default = 0.35, min = 0, max = 1 }
prune_drawdown_max = { type = "number", default = 0.50, min = 0, max = 1 }
loss_aversion = { type = "number", default = 1.5, min = 1, max = 5 }
